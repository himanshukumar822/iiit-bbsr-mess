<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Complaints - Admin Portal</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="brand-icon" style="background: linear-gradient(135deg, #188038, #34a853);">A</div>
        <div>
          <div class="brand-title">IIIT Mess</div>
          <div class="brand-subtitle">Admin Portal</div>
        </div>
      </div>
      <nav class="sidebar-menu">
        <a href="dashboard.html" class="nav-link">
          <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
          Dashboard
        </a>
        <a href="manage-menu.html" class="nav-link">
          <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
          Manage Menu
        </a>
        <a href="verify-payments.html" class="nav-link">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"/></svg>
          Verify Payments
        </a>
        <a href="mark-claims.html" class="nav-link">
          <svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>
          Mark Claims
        </a>
        <a href="spot-coupon.html" class="nav-link">
          <svg viewBox="0 0 24 24"><path d="M19 14V6c0-1.1-.9-2-2-2H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zm-9-1c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm13-6v11c0 1.1-.9 2-2 2H4v-2h17V7h2z"/></svg>
          Spot Coupon
        </a>
        <a href="leave-requests.html" class="nav-link">
          <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
          Leave Requests
        </a>
        <a href="complaints.html" class="nav-link active">
          <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 12h-2v-2h2v2zm0-4h-2V6h2v4z"/></svg>
          Complaints
        </a>
        <a href="students.html" class="nav-link">
          <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
          Students
        </a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn btn-outline btn-block btn-sm" data-logout>
          Sign Out
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button id="sidebar-toggle" class="menu-toggle-btn" aria-label="Toggle Navigation">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
          </button>
          <h2>Complaints & Feedback Management</h2>
        </div>
        <div class="user-badge">
          <div id="user-avatar" class="user-avatar" style="background-color: var(--accent);">A</div>
          <div>
            <div id="user-name" class="fw-bold">Mess Admin</div>
            <div id="user-role" class="text-xs text-muted">ADMIN</div>
          </div>
        </div>
      </header>

      <div class="page-body">
        <div class="page-header">
          <div>
            <h1 class="page-title">Student Complaints & Feedback</h1>
            <p class="page-description">Review food quality, hygiene reports, and track administrative resolutions</p>
          </div>
        </div>

        <!-- Filter Card -->
        <div class="card p-2 mb-3">
          <div class="flex gap-2 flex-wrap items-center">
            <div class="form-group mb-0" style="min-width: 180px;">
              <label class="form-label" for="filter-complaint-status">Filter Status</label>
              <select id="filter-complaint-status" class="form-select">
                <option value="">All Statuses</option>
                <option value="open" selected>Open (Needs Action)</option>
                <option value="in_progress">In Progress</option>
                <option value="resolved">Resolved</option>
              </select>
            </div>

            <div class="form-group mb-0" style="min-width: 180px;">
              <label class="form-label" for="filter-complaint-date">Filter by Date</label>
              <input type="date" id="filter-complaint-date" class="form-control">
            </div>

            <div style="margin-top: 1.5rem;">
              <button class="btn btn-outline" onclick="resetComplaintFilters()">Reset</button>
            </div>
          </div>
        </div>

        <!-- Complaints Container -->
        <div id="complaints-admin-container">
          <div class="loading-container"><div class="spinner"></div></div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await checkAuth(['admin', 'superadmin']);
      if (!user) return;

      loadAdminComplaints();

      document.getElementById('filter-complaint-status').addEventListener('change', loadAdminComplaints);
      document.getElementById('filter-complaint-date').addEventListener('change', loadAdminComplaints);
    });

    function resetComplaintFilters() {
      document.getElementById('filter-complaint-status').value = '';
      document.getElementById('filter-complaint-date').value = '';
      loadAdminComplaints();
    }

    async function loadAdminComplaints() {
      const container = document.getElementById('complaints-admin-container');
      container.innerHTML = '<div class="loading-container"><div class="spinner"></div></div>';

      const status = document.getElementById('filter-complaint-status').value;
      const date = document.getElementById('filter-complaint-date').value;

      let query = [];
      if (status) query.push(`status=${encodeURIComponent(status)}`);
      if (date) query.push(`date=${encodeURIComponent(date)}`);
      const qs = query.length > 0 ? `?${query.join('&')}` : '';

      try {
        const res = await api(`/api/admin/complaints${qs}`);
        const complaints = res.complaints || [];

        if (complaints.length === 0) {
          container.innerHTML = `
            <div class="card p-4 text-center">
              <p class="text-muted">No complaints found for the selected filter.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = complaints.map(c => `
          <div class="card mb-3" id="complaint-card-${c.id}">
            <div class="card-header flex justify-between items-center" style="background-color: var(--surface-alt);">
              <div>
                <strong>${escapeHtml(c.student_name)}</strong> (${escapeHtml(c.student_roll_no)}) &bull;
                <span class="text-xs text-muted">Hostel: ${escapeHtml(c.hostel || 'N/A')}${c.room_no ? ` / ${escapeHtml(c.room_no)}` : ''}</span> &bull;
                <span class="text-xs text-muted">${formatDate(c.meal_date)}</span>
              </div>
              <div id="badge-wrapper-${c.id}">${renderBadge(c.status)}</div>
            </div>

            <div class="card-body">
              <div class="flex gap-2 items-center mb-2">
                <span class="fw-bold text-primary" style="text-transform: capitalize;">${escapeHtml(c.meal_type)}</span>
                <span class="badge" style="background-color: var(--surface-alt);">${escapeHtml(c.category.replace(/_/g, ' '))}</span>
              </div>

              <div class="p-2 mb-3" style="background-color: var(--bg); border-radius: var(--radius-sm); border-left: 3px solid var(--border);">
                <div class="text-xs text-muted mb-1">COMPLAINT DESCRIPTION:</div>
                <p style="color: var(--text);">${escapeHtml(c.description)}</p>
              </div>

              <div class="card p-2" style="background-color: var(--surface-alt);">
                <div class="grid grid-cols-2 gap-2 mb-2">
                  <div class="form-group mb-0">
                    <label class="form-label" for="resp-status-${c.id}">Update Status</label>
                    <select id="resp-status-${c.id}" class="form-select">
                      <option value="resolved" selected>Resolved</option>
                      <option value="in_progress">In Progress</option>
                    </select>
                  </div>
                </div>

                <div class="form-group mb-2">
                  <label class="form-label" for="resp-text-${c.id}">Administrative Response / Action Taken *</label>
                  <textarea id="resp-text-${c.id}" class="form-textarea" placeholder="Explain the resolution or steps taken with mess staff...">${escapeHtml(c.response || '')}</textarea>
                </div>

                <div class="flex justify-end">
                  <button type="button" class="btn btn-primary btn-sm" onclick="submitResponse(${c.id})">
                    Save Response & Update Status
                  </button>
                </div>
              </div>
            </div>
          </div>
        `).join('');

      } catch (err) {
        container.innerHTML = '<div class="card p-3 text-center text-error">Failed to load complaints.</div>';
      }
    }

    async function submitResponse(id) {
      const response = document.getElementById(`resp-text-${id}`).value.trim();
      const status = document.getElementById(`resp-status-${id}`).value;

      if (!response) {
        showToast('Please enter an administrative response message', 'warning');
        return;
      }

      try {
        await api(`/api/admin/complaints/${id}`, {
          method: 'PUT',
          body: { response, status }
        });

        showToast(`Complaint marked as ${status.replace('_', ' ')}`, 'success');
        document.getElementById(`badge-wrapper-${id}`).innerHTML = renderBadge(status);
        setTimeout(() => loadAdminComplaints(), 600);
      } catch (err) {
        // Handled by api()
      }
    }
  </script>
</body>
</html>
